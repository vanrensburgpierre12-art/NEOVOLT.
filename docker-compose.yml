version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: neovolt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: neovolt123
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - neovolt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neovolt"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:neovolt123@postgres:5432/neovolt
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      PAYPAL_CLIENT_ID: your-paypal-client-id
      PAYPAL_CLIENT_SECRET: your-paypal-client-secret
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - neovolt-network
    command: sh -c "sleep 10 && npm run test-db && npm run migrate && node scripts/create-admin.js && npm start"

  frontend:
    build: ./frontend
    ports:
      - "650:80"
    depends_on:
      - backend
    networks:
      - neovolt-network

volumes:
  postgres_data:
  uploads_data:

networks:
  neovolt-network:
    driver: bridge